<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EcoSort · Browser checks</title>
<style>body{font:15px system-ui;margin:24px;color:#213d2b}pre{white-space:pre-wrap}iframe{width:1440px;height:1000px;border:1px solid #ccc;display:block}h1{font-size:24px}</style>
<body data-test-status="running">
<h1>EcoSort · Browser checks</h1>
<pre id="results">Starting a fresh prototype session…</pre>
<iframe id="app" title="EcoSort test instance"></iframe>
<script>
"use strict";
const frame = document.querySelector("#app");
const output = document.querySelector("#results");
const errors = [];
const messages = [];
let checks = 0;
const tick = (ms = 30) => new Promise(resolve => setTimeout(resolve, ms));
const doc = () => frame.contentDocument;
const win = () => frame.contentWindow;
const find = selector => doc().querySelector(selector);
function assert(condition, message) { checks++; if (!condition) throw new Error(message); }
function until(condition, message) {
  return (async () => {
    for (let attempt = 0; attempt < 150; attempt++) { if (condition()) return; await tick(30); }
    throw new Error(typeof message === "function" ? message() : message);
  })();
}
async function test(name, run) { await run(); messages.push(`PASS ${name}`); output.textContent = messages.join("\n"); }
async function click(selector) { const element = find(selector); assert(element, `Missing control: ${selector}`); element.click(); await tick(); }
async function change(selector, value, type = "change") { const element = find(selector); element.value = value; element.dispatchEvent(new (win().Event)(type, { bubbles: true })); await tick(); }
const pageFiles = {"landing": "landingpage.php", "scan": "scan.php", "result": "scan-result.php", "overview": "overview.php", "history": "history.php", "guide": "waste-guide.php"};
function pageURL(path) {
  const [page, material] = path.replace(/^#/, "").split("/");
  const query = material ? "?material=" + encodeURIComponent(material) : "";
  return new URL(pageFiles[page] + query, new URL("../", location.href)).href;
}
async function go(page, title) {
  const link = doc().createElement("a");
  link.href = pageURL(page); doc().body.append(link); link.click(); link.remove();
  await tick(); await until(() => find("#page-label")?.textContent === title, "Route " + page + " did not render");
}
async function upload(file) {
  const transfer = new (win().DataTransfer)(); transfer.items.add(file);
  const input = find("#image-file"); input.files = transfer.files; input.dispatchEvent(new (win().Event)("change", { bubbles: true }));
  await until(() => find("#dropzone")?.getAttribute("aria-busy") === "false", "Image validation did not finish");
}
async function load(file = "landingpage.php") {
  await new Promise(resolve => { frame.onload = resolve; frame.src = "../" + file; });
  await until(() => find("h1"), "Prototype did not start");
  win().addEventListener("error", event => errors.push(event.message));
  win().addEventListener("unhandledrejection", event => errors.push(String(event.reason)));
}
function luminance(hex) {
  const values = hex.match(/\w\w/g).map(value => parseInt(value, 16) / 255).map(value => value <= .04045 ? value / 12.92 : ((value + .055) / 1.055) ** 2.4);
  return values[0] * .2126 + values[1] * .7152 + values[2] * .0722;
}
function contrast(a, b) { const values = [luminance(a), luminance(b)].sort((x, y) => y - x); return (values[0] + .05) / (values[1] + .05); }

(async () => {
  try {
    await load();
    await test("Landing, Proceed, isolated screens, local assets, and accessible colors", async () => {
      assert(find("#landing-screen") === find("main").firstElementChild && find("#proceed"), "A fresh session must open the landing page");
      assert(find("#bottom-nav").hidden && !find("#scan-screen") && !find("#overview-screen"), "Landing should have one focused entry into the app");
      assert(!find("#help-launcher") && !find("#help-dialog") && !find("[data-mascot-slot]"), "The illustration must not restore the interactive helper");
      const illustration = find(".walkthrough-illustration img");
      assert(illustration?.src.endsWith("/assets/mascots/sheet-4.png") && illustration.naturalWidth === 1536 && illustration.naturalHeight === 1024, "The walkthrough must load the original sheet-4 artwork");
      assert(!/\bAI\b/.test(doc().title + doc().body.textContent), "Visible branding and copy must use EcoSort without AI");
      assert(!find("#mobile-menu") && !find(".menu-toggle") && !find(".sidebar"), "Old navigation must be removed");
      assert(doc().querySelectorAll(".landing-steps li").length === 3, "The scan, result, overview flow should be explained");
      const tokens = win().getComputedStyle(doc().documentElement);
      const token = name => tokens.getPropertyValue(name).trim().replace("#", "");
      for (const [a, b] of [[token("--text"), token("--bg")], [token("--muted"), token("--surface")], ["ffffff", token("--primary")], [token("--error"), token("--surface")]]) assert(contrast(a, b) >= 4.5, "Insufficient text contrast");
      assert(win().performance.getEntriesByType("resource").every(entry => entry.name.startsWith(win().location.origin)), "An asset requested an external origin");
      await click("#proceed"); await until(() => find("#page-label").textContent === "Scan Waste", "Proceed did not open the scanner");
      assert(find("#scan-screen") && !find("#overview-screen") && !find(".result-category") && !find("[data-stat]") && !find("table") && !find(".guide-list"), "Scan must only contain the scanner");
      assert(!find("#bottom-nav").hidden, "Proceed must reveal the bottom navigation");
      assert(!find('a[href="analytics.php"]') && !find('[data-tour-feature="analytics"]'), "Removed analytics must not appear in navigation or walkthrough");
      assert(win().getComputedStyle(find(".scan-panel")).boxShadow.includes(","), "Panels need paired neumorphic shadows");
      assert(win().getComputedStyle(find("#sample-scenario")).boxShadow.includes("inset"), "Inputs need a recessed surface");
      await go("overview", "Overview");
      assert(find('[data-stat="total"]').textContent === "5", "Expected five sample records");
      assert(!find("#scan-screen") && !find("#history-list") && !find(".guide-list") && !find(".result-category"), "Overview must not embed other feature screens");
      await click(".site-brand"); await until(() => find("#landing-screen"), "Brand should return to landing");
    });
    await test("Card carousel: five-second playback, manual controls, pause, and phone layout", async () => {
      frame.style.width = "1440px"; await load("landingpage.php");
      const steps = [...doc().querySelectorAll(".walkthrough-step")];
      const active = () => Number(find(".walkthrough-step[data-tour-active]").dataset.tourStep);
      assert(steps.length === 4 && !steps[0].hidden && steps.slice(1).every(step => step.hidden), "Show one card at a time");
      assert(!find(".tour-stepper") && !find(".tour-key-hint") && !find(".tour-scroll-hint"), "Remove the step tabs and keyboard hints");
      assert(!find("#walkthrough-status"), "Remove the visible card number and title indicator");
      for (const key of ["ArrowRight", "ArrowLeft", "Home", "End"]) doc().dispatchEvent(new (win().KeyboardEvent)("keydown", { key, bubbles: true }));
      assert(active() === 0, "Removed arrow shortcuts must not change cards");
      await click(".tour-arrow[data-tour-next]"); await click(".tour-arrow[data-tour-prev]");
      await tick(4500);
      assert(active() === 0, "Manual navigation must give the card a fresh five seconds");
      await until(() => active() === 1, "Playback must advance to the second card after five seconds");
      assert(doc().activeElement.tagName === "H1", "Automatic playback must not move keyboard focus");
      assert(find(".walkthrough-track").getAttribute("aria-live") === "off", "Automatic card changes should not interrupt announcements");
      if (win().matchMedia("(prefers-reduced-motion: reduce)").matches) assert(steps.every(step => step.getAnimations().length === 0), "Reduced motion must keep transitions still");
      await click("[data-tour-toggle]");
      assert(find("[data-tour-toggle]").textContent === "Play", "Pause must offer a Play action");
      await tick(5200);
      assert(active() === 1, "Pause must stop automatic card changes");
      await click('[data-tour-material="paper"]'); await click("[data-tour-sample]");
      await until(() => !find("#tour-upload-art").hidden, "The practice preview must still work");
      assert(find("#tour-sample-caption").textContent.includes("Folded newspaper"), "Practice item must match the selected material");
      await click("#tour-see-result");
      assert(active() === 2 && find("#tour-result-item").textContent === "Folded newspaper" && find("#tour-result-score").textContent === "91%", "The result card must reflect the selected sample");
      await click("[data-tour-demo-save]");
      assert(find("[data-tour-demo-save]").getAttribute("aria-pressed") === "true", "Practice save must still work");
      await click(".tour-arrow[data-tour-next]");
      assert(active() === 3 && !find(".tour-arrow[data-tour-next]").disabled, "The final card must keep Next available");
      await click('[data-tour-feature="history"]');
      assert(find("#tour-feature-description").textContent.includes("History:"), "The feature preview must still work");
      await click(".tour-arrow[data-tour-next]"); assert(active() === 0, "Next must loop to the first card");
      await click(".tour-arrow[data-tour-prev]"); assert(active() === 3, "Previous must loop to the last card");
      await click("[data-tour-restart]"); assert(active() === 0, "Replay must return to the first card");
      await click("[data-tour-toggle]");
      await tick(5100); assert(active() === 1, "Play must resume five-second card changes");
      find('[data-tour-material="paper"]').focus();
      await tick(5200);
      assert(active() === 1 && doc().activeElement.matches('[data-tour-material="paper"]'), "A focused demo must not disappear during use");
      doc().activeElement.blur(); await tick();
      await tick(5100); assert(active() === 2, "Playback must resume when focus leaves the card");
      await click(".tour-arrow[data-tour-next]"); await click("#tour-proceed");
      await until(() => find("#page-label").textContent === "Scan Waste", "The final CTA must open Scan");
      await go("overview", "Overview");
      assert(find('[data-stat="total"]').textContent === "5", "Practice playback must not change saved records");

      frame.style.width = "375px"; await load("landingpage.php");
      assert(doc().querySelectorAll(".walkthrough-step:not([hidden])").length === 1, "Phones must show one card at a time");
      for (const direction of ["prev", "next"]) {
        const bounds = find('.tour-arrow[data-tour-' + direction + ']').getBoundingClientRect();
        assert(bounds.width >= 44 && bounds.height >= 44, "Phone navigation needs visible touch-sized controls");
      }
      await click(".tour-arrow[data-tour-next]"); assert(active() === 1, "Phone Next must show the second card");
      await click(".tour-arrow[data-tour-prev]"); assert(active() === 0, "Phone Previous must show the first card");
      await tick(5100); assert(active() === 1, "Five-second playback must work on phones");
      frame.style.width = "1440px"; await tick();
    });
    await test("Navigation, browser back/forward, focus, skip link, and direct results", async () => {
      await go("scan", "Scan Waste");
      assert(doc().activeElement.tagName === "H1", "Route changes should focus the heading");
      await click(".skip-link");
      assert(win().location.href === pageURL("scan") && doc().activeElement.id === "main", "Skip link changed route or did not focus content");
      await go("history", "History"); win().history.back();
      await until(() => find("#page-label").textContent === "Scan Waste", "Back navigation failed");
      win().history.forward(); await until(() => find("#page-label").textContent === "History", "Forward navigation failed");
      await go("result", "Scan Result");
      assert(find("main").textContent.includes("No result is available") && !find("#scan-screen"), "Empty direct result link is missing");
      await click('main a[href="scan.php"]'); await until(() => find("#scan-screen"), "Empty result recovery failed");
      await go("landing", "Welcome"); assert(find("#landing-screen"), "Landing navigation failed");
    });
    await test("Scan to result to overview, honest labels, and duplicate-save prevention", async () => {
      await go("scan", "Scan Waste");
      assert(find('[data-action="classify"]').disabled, "Classify must be disabled without an image");
      await click('[data-action="use-sample"]'); await click('[data-action="classify"]');
      assert(find(".processing-overlay").textContent.includes("No image analysis"), "Sample loading disclosure is missing");
      await until(() => find("#page-label").textContent === "Scan Result", "Scan did not open the result page");
      assert(find(".result-category").textContent === "Plastic", "Wrong scripted result");
      assert(!find("#scan-screen") && !find("#overview-screen") && !find("#history-list"), "Result must be its own screen");
      assert(doc().activeElement.tagName === "H1" && win().scrollY === 0, "Result should open at its heading");
      assert(find('#bottom-nav a[aria-current="page"]').href === pageURL("scan"), "Results should stay within Scan");
      assert(find(".confidence-track").getAttribute("aria-valuenow") === "96", "Wrong illustrative score");
      assert(find("main").textContent.includes("Preset result. Photo not analyzed."), "Result must disclose its illustrative nature");
      assert(find('[data-action="save-result"]').classList.contains("primary") && find('.result-content a[href="overview.php"]').classList.contains("secondary"), "Saving must be the primary action for a new result");
      await click('[data-action="save-result"]');
      assert(find('[data-action="save-result"]').disabled, "Saved result should not be saveable twice");
      assert(find('.result-content a[href="overview.php"]').classList.contains("primary") && !find('[data-action="save-result"]').classList.contains("primary"), "Saved results must promote Continue to Overview as the next action");
      await click('[data-action="save-result"]');
      await click('.result-content a[href="overview.php"]'); await until(() => find("#overview-screen"), "Continue should open overview");
      assert(!find("#scan-screen") && !find(".result-category") && find(".overview-summary").textContent.includes("Plastic"), "Overview should summarize the result separately");
      assert(find('[data-stat="total"]').textContent === "6", "Save count or duplicate prevention failed");
      await click('.overview-summary a[href="scan-result.php"]'); await until(() => find(".result-category"), "Overview should reopen the latest result");
      await go("overview", "Overview"); assert(find('[data-stat="total"]').textContent === "6", "Overview count changed unexpectedly");
    });
    await test("Repeated scans replace the dedicated result without automatic saving", async () => {
      for (const [category, label] of [["paper", "Paper"], ["metal", "Metal"]]) {
        await click('[data-action="scan-another"]'); await until(() => find("#scan-screen"), "Scan another did not open the scanner");
        await change("#sample-scenario", category); await click('[data-action="use-sample"]'); await click('[data-action="classify"]');
        await until(() => find("#page-label").textContent === "Scan Result", "Repeat scan did not open its result");
        assert(find(".result-category").textContent === label && win().location.href === pageURL("result"), "Repeat scan did not replace the result");
        assert(!find("#scan-screen") && win().scrollY === 0, "Repeat result should start on a separate screen");
        await click('.result-content a[href="overview.php"]'); await until(() => find("#overview-screen"), "Repeat result could not continue to overview");
        assert(find('[data-stat="total"]').textContent === "6", "Viewing a result should not save it automatically");
      }
    });
    await test("History filtering, typing focus, empty search, and details dialog", async () => {
      await go("history", "History");
      assert(doc().querySelectorAll("tbody tr").length === 6, "Saved record missing");
      const ranking = [...doc().querySelectorAll(".material-ranking li")];
      const counts = ranking.map(item => Number(item.querySelector("[data-material-count]").textContent));
      assert(ranking.length === 4 && ranking[0].dataset.material === "plastic" && counts[0] === 3, "Most scanned material must include the new saved scan");
      assert(counts.reduce((sum, count) => sum + count, 0) === 6 && counts.every((count, index) => count > 0 && (!index || counts[index - 1] >= count)), "Material rankings must use all saved scans, omit zero counts, and sort descending");
      assert(counts.slice(1).every(count => count === 1), "Tied materials must retain their actual counts");
      assert(!find(".bars") && !find(".donut") && doc().querySelectorAll("thead th").length === 4, "History should show materials and recent items without charts or confidence columns");
      await change("#history-filter", "paper"); assert(doc().querySelectorAll("tbody tr").length === 1, "Material filter failed");
      assert(find('.material-ranking [data-material="plastic"] [data-material-count]').textContent === "3", "Record filters must not change the overall material ranking");
      find("#history-search").focus(); await change("#history-search", "newspaper", "input");
      assert(doc().activeElement.id === "history-search", "Typing lost focus");
      assert(doc().querySelectorAll("tbody tr").length === 1, "History search failed");
      await click('#history-list [data-action="record"]'); assert(find("#record-dialog").open, "Details dialog did not open");
      assert(find("#record-title").textContent === "Folded newspaper", "Wrong record details");
      await click('#record-dialog [data-action="close-dialog"]');
      await change("#history-search", "no-such-item", "input"); assert(find("#history-list").textContent.includes("No matching scans"), "No-match state missing");
      await click('[data-action="reset-history-filters"]'); assert(doc().querySelectorAll("tbody tr").length === 6, "Reset filters failed");
    });
    await test("Camera simulation, keyboard tabs, and uncertain result", async () => {
      await go("scan", "Scan Waste"); await click('[data-action="reset"]');
      find("#upload-tab").dispatchEvent(new (win().KeyboardEvent)("keydown", { key: "ArrowRight", bubbles: true })); await tick();
      assert(find("#camera-tab").getAttribute("aria-selected") === "true", "Arrow-key tab switching failed");
      assert(find("#scan-preview-panel").textContent.includes("No camera access"), "Camera simulation disclosure missing");
      assert(find('[data-action="capture"]').classList.contains("primary"), "Capture must lead before a camera sample is ready");
      await change("#sample-scenario", "uncertain"); await click('[data-action="capture"]');
      assert(find('[data-action="capture"]').classList.contains("secondary") && !find('[data-action="classify"]').disabled, "A ready sample must shift emphasis from Capture to viewing the result");
      await click('[data-action="classify"]');
      await until(() => find("#page-label").textContent === "Scan Result", "Uncertain result did not appear");
      assert(find(".result-category").textContent.includes("Unable to classify confidently"), "Uncertain state is missing");
      assert(find(".confidence-track").getAttribute("aria-valuenow") === "34", "Uncertain score is incorrect");
      await click('[data-action="save-result"]');
    });
    await test("History counts uncertain scans without claiming completed recycling", async () => {
      await go("history", "History");
      assert(find('[data-stat="total"]').textContent === "7", "History count is stale");
      assert(doc().querySelectorAll(".material-ranking li").length === 5, "Saved uncertain material is missing from History");
      assert(find('.material-ranking [data-material="uncertain"] [data-material-count]').textContent === "1", "Uncertain scan count is wrong");
      assert(find(".history-summary").textContent.includes("saved scans") && !find(".history-summary").textContent.includes("recycled"), "Scan counts must not claim completed recycling");
    });
    await test("Valid local image preview and safe filename rendering", async () => {
      await go("scan", "Scan Waste"); await click("#upload-tab");
      const canvas = document.createElement("canvas"); canvas.width = canvas.height = 32; canvas.getContext("2d").fillRect(0, 0, 32, 32);
      const blob = await new Promise(resolve => canvas.toBlob(resolve, "image/png"));
      const filename = '<img src=x onerror="window.injected=true">.png';
      await upload(new (win().File)([blob], filename, { type: "image/png" }));
      assert(find(".preview-image")?.naturalWidth === 32, "Local image preview did not decode");
      assert(!find('[data-action="classify"]').disabled, "Valid image should enable classify");
      assert(find(".file-info").textContent.includes(filename) && !find(".file-info img") && !win().injected, "Filename was interpreted as markup");
      await change("#sample-scenario", "glass"); await click('[data-action="classify"]');
      await until(() => find(".result-category")?.textContent === "Glass", "Uploaded image scripted scenario failed");
      await click('[data-action="save-result"]'); await click('[data-action="scan-another"]');
      await go("history", "History"); await click('#history-list [data-action="record"]');
      assert(find("#record-dialog img")?.complete && find("#record-dialog img").naturalWidth === 32, "Reset revoked an image retained by history");
      await click('#record-dialog [data-action="close-dialog"]');
    });
    await test("Unsupported, empty, oversized, corrupt, and multiple-file errors", async () => {
      await go("scan", "Scan Waste");
      for (const [file, message] of [
        [new (win().File)(["text"], "note.txt", { type: "text/plain" }), "JPEG, PNG, or WebP"],
        [new (win().File)([], "empty.png", { type: "image/png" }), "empty"],
        [new (win().File)([new Uint8Array(10 * 1024 * 1024 + 1)], "large.png", { type: "image/png" }), "too large"],
        [new (win().File)(["not an image"], "broken.png", { type: "image/png" }), "couldn’t open"]
      ]) { await upload(file); assert(find("#upload-error").textContent.includes(message), `Missing ${message} error`); assert(find('[data-action="classify"]').disabled, "Invalid file enabled classification"); }
      const transfer = new (win().DataTransfer)(); transfer.items.add(new (win().File)(["x"], "one.png", { type: "image/png" })); transfer.items.add(new (win().File)(["y"], "two.png", { type: "image/png" }));
      find("#dropzone").dispatchEvent(new (win().DragEvent)("drop", { dataTransfer: transfer, bubbles: true, cancelable: true })); await tick();
      assert(find("#upload-error").textContent.includes("one image at a time"), "Multiple-file drop should be rejected");
    });
    await test("Reset and navigation safely cancel pending sample processing", async () => {
      await click('[data-action="use-sample"]'); await click('[data-action="classify"]'); await click('.scan-actions [data-action="reset"]'); await tick(1100);
      assert(win().location.href === pageURL("scan") && find('[data-action="classify"]').disabled, "Reset did not cancel the pending result");
      await click('[data-action="use-sample"]'); await click('[data-action="classify"]'); await go("history", "History"); await tick(1100);
      assert(find("#page-label").textContent === "History", "Pending processing hijacked navigation");
    });
    await test("Guide deep links, native disclosure, search, and reset", async () => {
      await go("guide/paper", "Waste Guide");
      assert(find("#guide-filter").value === "paper" && find("details").open, "Material deep link did not expand the correct card");
      await change("#guide-filter", "all"); assert(doc().querySelectorAll("details").length === 5, "Guide categories missing");
      await change("#guide-search", "newspaper", "input"); assert(doc().querySelectorAll("details").length === 1 && find("details h2").textContent === "Paper", "Guide search failed");
      await change("#guide-search", "not-a-material", "input"); assert(find("#guide-results").textContent.includes("another search"), "Guide no-match state missing");
      await click('[data-action="reset-guide-filters"]'); assert(doc().querySelectorAll("details").length === 5, "Guide filter reset failed");
      assert(find(".special-handling").textContent.includes("Batteries"), "Special-handling reminder missing");
      assert(find(".material-metal .guide-caution").textContent.includes("Do not puncture") && find(".material-glass .guide-caution").textContent.includes("bare hands"), "Concise guidance must preserve pressurized-container and broken-glass precautions");
    });
    await test("Responsive layouts at phone, tablet, laptop, and desktop widths", async () => {
      for (const width of [375, 768, 1024, 1440]) {
        frame.style.width = `${width}px`; await tick();
        for (const [hash, title] of [["landing", "Welcome"], ["scan", "Scan Waste"], ["overview", "Overview"], ["result", "Scan Result"], ["history", "History"], ["guide", "Waste Guide"]]) {
          await go(hash, title);
          const viewport = doc().documentElement.clientWidth;
          const overflow = [...doc().querySelectorAll("body *")].filter(element => !element.closest(".table-wrap") && element.getBoundingClientRect().right > viewport + 1).slice(0, 8).map(element => `${element.tagName}.${element.className.baseVal ?? element.className} (${Math.round(element.getBoundingClientRect().right)})`).join(", ");
          assert(doc().documentElement.scrollWidth <= viewport + 1, `Horizontal page overflow at ${width}px on ${hash}: scroll=${doc().documentElement.scrollWidth}, client=${viewport}, inner=${win().innerWidth}, body=${doc().body.scrollWidth}, table=${find(".table-wrap")?.clientWidth}/${find(".table-wrap")?.scrollWidth}, x=${win().scrollX}; ${overflow}`);
        }
      }
    });
    await test("Bottom navigation on desktop, tablet, and phone", async () => {
      for (const width of [1440, 768, 375]) {
        frame.style.width = width + "px"; await tick(); await go("scan", "Scan Waste");
        const nav = find("#bottom-nav");
        assert(doc().querySelectorAll("#bottom-nav a").length === 4, "Bottom navigation should have exactly four destinations");
        for (const [destination, title] of [["scan", "Scan Waste"], ["overview", "Overview"], ["history", "History"], ["guide", "Waste Guide"]]) {
          await click('#bottom-nav a[href="' + pageFiles[destination] + '"]');
          await until(() => find("#page-label").textContent === title, "Bottom link did not navigate");
          assert(doc().querySelectorAll('#bottom-nav [aria-current="page"]').length === 1 && find('#bottom-nav [aria-current="page"]').href === pageURL(destination), "Wrong active navigation destination");
          assert(win().scrollY === 0, "Screen changes must open at the top, without native fragment scrolling");
          const bounds = nav.getBoundingClientRect();
          assert(Math.abs(bounds.bottom - win().innerHeight) <= 1 && bounds.left >= 0 && bounds.right <= win().innerWidth + 1, "Bottom bar left the viewport");
          const target = find('#bottom-nav a[href="' + pageFiles[destination] + '"]').getBoundingClientRect();
          assert(target.width >= 44 && target.height >= 44, "Bottom navigation needs touch-sized targets");
          assert(!find("#scan-screen") || (!find("#history-list") && !find(".guide-list") && !find(".bars")), "Features leaked into the scanner");
        }
        await go("guide/plastic", "Waste Guide");
        assert(find('#bottom-nav [aria-current="page"]').href === pageURL("guide"), "Guide deep links should keep Guide active");
        find('.app-footer [data-action="about"]').scrollIntoView({ block: "center" }); await tick();
        assert(find('.app-footer [data-action="about"]').getBoundingClientRect().bottom <= nav.getBoundingClientRect().top, "Navigation obscures the final control");
      }
      await click('.app-footer [data-action="about"]'); assert(find("#about-dialog").open, "About dialog did not open");
      await click('#about-dialog [data-action="close-dialog"]'); assert(!find("#about-dialog").open, "About dialog close failed");
    });
    await test("Clear confirmation, zero-data states, restoration, and refresh reset", async () => {
      await go("history", "History"); await click('[data-action="clear-history"]');
      assert(find("#clear-dialog").open, "Clear confirmation is missing");
      await click('#clear-dialog [data-action="close-dialog"]'); assert(doc().querySelectorAll("#history-list tbody tr").length === 8, "Cancel deleted history");
      await click('[data-action="clear-history"]'); await click('[data-action="confirm-clear"]');
      assert(find("#history-list").textContent.includes("No scans yet"), "Empty history state is missing");
      assert(find('[data-stat="total"]').textContent === "0" && !find(".material-ranking"), "Clearing History must remove the material ranking");
      await click('[data-action="restore-samples"]'); assert(find('[data-stat="total"]').textContent === "5", "Sample restoration failed");
      assert(find('.material-ranking li').dataset.material === "plastic" && find('[data-material-count]').textContent === "2", "Restoring samples must rebuild the material ranking");
      await load(); await go("overview", "Overview"); assert(find('[data-stat="total"]').textContent === "5", "Refresh did not restore sample state");
    });
    await test("Direct PHP pages, guide parameters, and legacy bookmark migration", async () => {
      for (const [page, title] of [["landing", "Welcome"], ["scan", "Scan Waste"], ["result", "Scan Result"], ["overview", "Overview"], ["history", "History"], ["guide", "Waste Guide"]]) {
        await load(pageFiles[page]);
        assert(win().location.href === pageURL(page) && !win().location.hash, "Direct page did not keep its named URL");
        assert(find("#page-label").textContent === title && doc().body.dataset.route === page, "Direct page rendered the wrong screen");
        assert(doc().title === title + " · EcoSort", "Direct page title is incorrect");
        assert(!/\bAI\b/.test(doc().body.textContent), "Screens must not retain AI wording");
        const artwork = [...doc().querySelectorAll('img[src*="assets/mascots/"]')];
        assert(artwork.every(image => image.src.endsWith("/sheet-4.png")) && (page === "landing" || artwork.length === 0), "Use only sheet-4 and only in the walkthrough");
      }
      await load("waste-guide.php?material=glass");
      assert(find("#guide-filter").value === "glass" && doc().querySelectorAll(".guide-card").length === 1, "Guide query deep link failed");
      await load("index.html#guide/paper");
      assert(win().location.href === pageURL("guide/paper") && find("#guide-filter").value === "paper", "Legacy index/hash bookmark did not migrate");
      await load("landingpage.php#home");
      assert(win().location.href === pageURL("overview") && find('[data-stat="total"]').textContent === "5", "Legacy home bookmark failed");
      await load("analytics.php");
      assert(win().location.href === pageURL("history") && find("#most-scanned-title"), "Removed analytics URL must redirect to History");
      await load("landingpage.php#analytics");
      assert(win().location.href === pageURL("history") && find("#most-scanned-title"), "Legacy analytics bookmark must migrate to History");
      await load("waste-guide.php?material=%3Cimg%20src%3Dx%20onerror%3Dalert(1)%3E");
      assert(find("#guide-filter").value === "all" && doc().querySelectorAll(".guide-card").length === 5, "Unknown material must fall back to all materials");
    });
    await test("No uncaught application errors", async () => { assert(errors.length === 0, errors.join("; ")); });
    messages.push(`\n${messages.length} groups passed · ${checks} assertions. Reduced-motion preference: ${win().matchMedia("(prefers-reduced-motion: reduce)").matches ? "enabled" : "not enabled"}.`);
    output.textContent = messages.join("\n"); document.body.dataset.testStatus = "passed";
  } catch (error) {
    output.textContent = `${messages.join("\n")}\nFAIL ${error.stack || error}`; document.body.dataset.testStatus = "failed";
  }
})();
</script>
