<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Eco mascot motion checks</title>
<body data-test-status="running">
<pre id="results">Checking contextual animation and cancellation…</pre>
<iframe id="app" title="EcoSort motion test" style="width:1000px;height:900px"></iframe>
<script>
const frame = document.querySelector("#app");
const output = document.querySelector("#results");
let checks = 0;
function assert(condition, message) { checks++; if (!condition) throw new Error(message); }
frame.addEventListener("load", async () => {
  try {
    const doc = frame.contentDocument;
    const queryPrototype = frame.contentWindow.MediaQueryList.prototype;
    const nativeMatches = Object.getOwnPropertyDescriptor(queryPrototype, "matches").get;
    // shortcut: JS preference is emulated; use DevTools for end-to-end media preference changes.
    Object.defineProperty(queryPrototype, "matches", { get() { return this.media === "(prefers-reduced-motion: reduce)" ? false : nativeMatches.call(this); } });
    const reduced = frame.contentWindow.matchMedia("(prefers-reduced-motion: reduce)").matches;
    assert(!reduced, "Run this fixture with motion enabled; the main suite covers reduced motion");
    const portrait = doc.querySelector("#help-launcher [data-mascot-slot]");
    doc.querySelector('.scan-actions [data-action="reset"]').click();
    assert(doc.body.dataset.mascotState === "ready", "Reset did not set the ready pose");
    const previous = portrait.getAnimations();
    assert(reduced ? previous.length === 0 : previous.length === 1, "Motion did not follow the system preference");
    doc.querySelector("#camera-tab").click();
    assert(previous.every(animation => animation.playState === "idle"), "Old motion must be canceled when the context changes");
    assert(doc.body.dataset.mascotState === "camera", "Camera did not select the scanning pose");
    doc.querySelector("#upload-tab").click(); doc.querySelector('[data-action="use-sample"]').click(); doc.querySelector('[data-action="classify"]').click();
    assert(doc.body.dataset.mascotState === "processing", "Processing did not set its inspecting pose");
    const processing = portrait.getAnimations();
    doc.querySelector('.scan-actions [data-action="reset"]').click();
    assert(processing.every(animation => animation.playState === "idle"), "Reset must cancel processing motion");
    await new Promise(resolve => setTimeout(resolve, 1100));
    assert(doc.body.dataset.mascotState === "ready", "A canceled scan left a delayed reaction");
    output.textContent = `${checks} motion assertions passed with an emulated motion preference and native browser animations. Prior animations and canceled scan reactions are cleared.`;
    document.body.dataset.testStatus = "passed";
  } catch (error) { output.textContent = error.stack || error; document.body.dataset.testStatus = "failed"; }
});
frame.src = "../scan.php";
</script>
</body>
</html>
